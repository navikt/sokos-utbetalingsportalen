name: Digestabot Auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

env:
  TZ: Europe/Oslo

jobs:
  digestabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    uses: navikt/mob-gha-workflows/.github/workflows/digestabot-automerge.yaml@6d597f4b49bff3f5e59833b784eb63aa5ddc8603 # ratchet:navikt/mob-gha-workflows/.github/workflows/digestabot-automerge.yaml@v1.0.2
    name: Digestabot Auto-merge
    secrets:
      APP_ID: ${{ vars.APP_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
