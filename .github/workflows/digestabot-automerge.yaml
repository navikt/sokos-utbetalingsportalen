name: Digestabot Auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

env:
  TZ: Europe/Oslo

jobs:
  digestabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/digestabot-automerge.yaml@f73c3476dd098d2530c777a60576c7b0b941b3a6 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/digestabot-automerge.yaml@v1.1.1
    name: Digestabot Auto-merge
    secrets:
      APP_ID: ${{ vars.APP_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
