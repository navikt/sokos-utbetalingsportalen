name: Build & test PR

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENCE"
      - "CODEOWNERS"
      - ".gitignore"
      - ".github/skills/**"
      - ".github/workflows/codeql-scan.yaml"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/manual-deploy.yaml"
      - ".github/dependabot.yaml"
      - ".nais/**"

env:
  TZ: Europe/Oslo

jobs:
  build-test-pr:
    permissions:
      contents: read
    name: Build & test application
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-pr.yaml@f73c3476dd098d2530c777a60576c7b0b941b3a6 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-pr.yaml@v1.1.1
    with:
      has-vitest: true
    secrets: inherit
