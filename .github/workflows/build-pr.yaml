name: Build & test PR

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENCE"
      - "CODEOWNERS"
      - ".gitignore"
      - ".github/skills/**"
      - ".github/workflows/codeql-scan.yaml"
      - ".github/workflows/deploy.yaml"
      - '.github/workflows/digestabot-automerge.yaml'
      - '.github/workflows/digestabot-update.yaml'
      - ".github/workflows/manual-deploy.yaml"
      - ".github/dependabot.yaml"
      - ".nais/**"

env:
  TZ: Europe/Oslo

jobs:
  build-test-pr:
    permissions:
      contents: read
    name: Build & test application
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-pr.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-pr.yaml@v1.1.0
    with:
      has-vitest: true
    secrets: inherit
